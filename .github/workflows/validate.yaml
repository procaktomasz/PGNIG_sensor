name: Walidacja

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS waliduje tylko repozytoria publiczne - dla prywatnego zadanie jest pomijane
    # (zdarzenie schedule nie zawiera informacji o repozytorium, dlatego jest wyłączone)
    if: ${{ github.event_name != 'schedule' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
